# Prototype for discussion. Weekly check of every source in external/registry.json.
#   mirrored -> refresh the unmodified copy and open (or refresh) ONE draft PR whose diff shows
#               every upstream change. A code owner reviews it; merging ships it.
#   absorbed -> open (or refresh) one issue per source: "upstream changed, anything worth taking?"
# Requires the org/repo setting "Allow GitHub Actions to create and approve pull requests".
name: external-skills

on:
  schedule:
    - cron: "17 4 * * 1"   # Mondays 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check upstream heads
        run: python3 scripts/external_skills.py check --apply --out "$RUNNER_TEMP/ext"
      - name: Open or refresh the mirror sync PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then echo "Mirrors are up to date."; exit 0; fi
          branch=bot/external-skills-sync
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add -A plugins external
          git commit -m "external skills: sync mirrors with upstream"
          git push --force-with-lease origin "$branch"
          {
            echo "Upstream changes to review. The diff below **is** the upstream change; mirrors are never edited by hand."
            echo
            cat "$RUNNER_TEMP/ext/mirrored.md"
            echo
            echo "Before approving: read every changed instruction and script; flag new network calls, shell commands or broader file writes; confirm the LICENSE is unchanged; run the plugin's evals."
          } > "$RUNNER_TEMP/body.md"
          if gh pr view "$branch" >/dev/null 2>&1; then
            gh pr edit "$branch" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr create --draft --head "$branch" --title "External skills: upstream changes to review" --body-file "$RUNNER_TEMP/body.md"
          fi
      - name: Open or refresh "anything worth taking?" issues for absorbed sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          for f in "$RUNNER_TEMP"/ext/absorbed-*.md; do
            id="$(basename "$f" .md)"; id="${id#absorbed-}"
            title="Upstream changed: $id"
            num="$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')"
            if [ -n "$num" ]; then gh issue edit "$num" --body-file "$f"; else gh issue create --title "$title" --body-file "$f"; fi
          done
